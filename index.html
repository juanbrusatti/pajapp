<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pajapp</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤚</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#1d1a16; --muted:#7a7066; --line:#eadfd2;
  --accent:#ff5a1f; --accent-ink:#fff; --gold:#f2b705; --soft:#fff1e3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16130f; --card:#211c17; --ink:#f6efe7; --muted:#a39587; --line:#3a3129; --soft:#2b231c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(40px,8vw,72px);line-height:.9;margin:0;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:8px 0 0;font-size:15px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#2fbf71}
.dot.off{background:#d94848}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow:auto;margin-bottom:20px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px Inter;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .15s}
.card.lead{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.crown{position:absolute;top:-14px;right:14px;font-size:26px}
.name{font-family:"Bricolage Grotesque";font-weight:700;font-size:22px}
.count{font-family:"Bricolage Grotesque";font-weight:800;font-size:64px;line-height:1;letter-spacing:-.04em}
.meta{color:var(--muted);font-size:13px}
.btns{display:flex;gap:8px;margin-top:auto}
.plus{flex:1;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 18px Inter;padding:14px;cursor:pointer;transition:transform .08s}
.plus:active{transform:scale(.96)}
.minus{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:14px;width:48px;font:600 18px Inter;cursor:pointer}
.bar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.05) rotate(-1deg)}}
section h2{font-family:"Bricolage Grotesque";font-size:24px;margin:36px 0 12px}
.feed{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.item b{font-family:"Bricolage Grotesque"}
.item .q{font-style:italic;margin-top:2px;word-break:break-word}
.item .t{color:var(--muted);font-size:12px;margin-top:4px}
.item .del{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:20px;padding:22px;background:var(--card);color:var(--ink);width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-family:"Bricolage Grotesque";margin:0 0 4px;font-size:24px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
dialog input,dialog textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:15px Inter}
dialog textarea{resize:vertical;min-height:80px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.row button{border:0;border-radius:12px;padding:10px 18px;font:600 15px Inter;cursor:pointer}
.ghost{background:var(--soft);color:var(--ink)}
.go{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;transition:transform .25s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.warn{background:#fff3cd;color:#6b5200;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Paj<span>app</span></h1>
      <p class="sub">El contador oficial de pajereadas de la oficina. Lo decidimos nosotros.</p>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">conectando…</span></div>
  </header>

  <div id="warn"></div>

  <div class="tabs" id="tabs">
    <button data-r="hoy">Hoy</button>
    <button data-r="semana">Semana</button>
    <button data-r="mes">Mes</button>
    <button data-r="total" class="on">Histórico</button>
  </div>

  <div class="grid" id="grid"></div>

  <section>
    <h2>Últimas pajereadas</h2>
    <div class="feed" id="feed"></div>
  </section>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">Pajereada</h3>
    <div class="meta">¿Qué dijo? (opcional, pero queda para la historia)</div>
    <label for="frase">La frase</label>
    <textarea id="frase" maxlength="300" placeholder="“Yo eso lo hago en dos horas”"></textarea>
    <label for="por">Anotada por</label>
    <input id="por" maxlength="40" placeholder="Tu nombre">
    <div class="row">
      <button type="button" class="ghost" id="cancel">Cancelar</button>
      <button type="submit" class="go">+1 Pajereada</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
// ⚙️ URL del Web App de Google Apps Script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzrnK_2ID1uhDrbLEtsfXJXS5qu-V09loWCdrTGgimm6172__Q79wdc2nC061rlh2r/exec';
const NOMBRES = ['Juancho', 'Puntano', 'Ivan', 'Mati', 'Alan', 'Bachi', 'Head'];
const EMOJI = { Juancho:'🧉', Puntano:'🏜️', Ivan:'🐻', Mati:'⚡', Alan:'⚽', Bachi:'🐷', Head:'🍆' };

let data = [];
let rango = 'total';
let target = null;
let busy = false;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
rango = store.get('pajapp.rango', 'total');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function setStatus(ok, txt){
  $('dot').classList.toggle('off', !ok);
  $('statusTxt').textContent = txt;
}

async function api(params){
  if (!SCRIPT_URL) {
    // modo demo local
    let local = store.get('pajapp.demo', []);
    if (params.action === 'add') local.push({ id: Math.random().toString(36).slice(2,10), fecha: new Date().toISOString(), nombre: params.nombre, frase: params.frase, por: params.por });
    if (params.action === 'delete') local = local.filter(x => x.id !== params.id);
    store.set('pajapp.demo', local);
    return local;
  }
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(SCRIPT_URL + '?' + qs);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.data;
}

function desde(r){
  const d = new Date(); d.setHours(0,0,0,0);
  if (r === 'hoy') return d;
  if (r === 'semana'){ const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d; }
  if (r === 'mes'){ d.setDate(1); return d; }
  return new Date(0);
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.r === rango));
  const from = desde(rango), hoy = desde('hoy');
  const enRango = data.filter(x => new Date(x.fecha) >= from);
  const counts = Object.fromEntries(NOMBRES.map(n => [n, 0]));
  const hoyC = Object.fromEntries(NOMBRES.map(n => [n, 0]));
  enRango.forEach(x => { if (x.nombre in counts) counts[x.nombre]++; });
  data.forEach(x => { if (new Date(x.fecha) >= hoy && x.nombre in hoyC) hoyC[x.nombre]++; });
  const max = Math.max(1, ...Object.values(counts));
  const orden = [...NOMBRES].sort((a,b) => counts[b] - counts[a]);
  const lider = counts[orden[0]] > 0 && counts[orden[0]] > counts[orden[1]] ? orden[0] : null;

  $('grid').innerHTML = orden.map(n => `
    <div class="card ${n === lider ? 'lead' : ''}" id="c-${n}">
      ${n === lider ? '<div class="crown" title="Rey de la pajereada">👑</div>' : ''}
      <div class="name">${EMOJI[n]} ${n}</div>
      <div class="count">${counts[n]}</div>
      <div class="bar"><i style="width:${counts[n] / max * 100}%"></i></div>
      <div class="meta">${hoyC[n]} hoy</div>
      <div class="btns">
        <button class="plus" data-add="${n}">+1</button>
        <button class="minus" data-undo="${n}" title="Borrar la última de ${n}">−</button>
      </div>
    </div>`).join('');

  const ult = [...data].sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 30);
  $('feed').innerHTML = ult.length ? ult.map(x => `
    <div class="item">
      <div style="font-size:22px">${EMOJI[x.nombre] || '🤚'}</div>
      <div>
        <b>${esc(x.nombre)}</b>
        ${x.frase ? `<div class="q">“${esc(x.frase)}”</div>` : ''}
        <div class="t">${fmt(x.fecha)}${x.por ? ' · anotada por ' + esc(x.por) : ''}</div>
      </div>
      <button class="del" data-del="${x.id}" title="Borrar">✕</button>
    </div>`).join('') : '<div class="empty">Todavía nadie dijo ninguna pajereada. Sospechoso.</div>';
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR', { weekday:'short', day:'numeric', month:'short' }) + ' ' + d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}

async function load(){
  if (busy) return;
  try {
    data = await api({ action: 'list' });
    setStatus(true, SCRIPT_URL ? 'en vivo · Google Sheets' : 'modo demo (local)');
    render();
  } catch (e) {
    setStatus(false, 'sin conexión');
  }
}

async function mutate(params, okMsg){
  busy = true;
  try {
    data = await api(params);
    render();
    toast(okMsg);
  } catch (e) {
    toast('Error: ' + e.message);
  } finally { busy = false; }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.r){ rango = t.dataset.r; store.set('pajapp.rango', rango); render(); }
  if (t.dataset.add){
    target = t.dataset.add;
    $('dlgTitle').textContent = `Pajereada de ${target} ${EMOJI[target]}`;
    $('frase').value = '';
    $('por').value = store.get('pajapp.por', '');
    $('dlg').showModal(); $('frase').focus();
  }
  if (t.dataset.undo){
    const n = t.dataset.undo;
    const ult = data.filter(x => x.nombre === n).sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];
    if (!ult) return toast(`${n} está limpio`);
    if (confirm(`¿Borrar la última pajereada de ${n}?${ult.frase ? '\n“' + ult.frase + '”' : ''}`)) mutate({ action:'delete', id: ult.id }, 'Borrada');
  }
  if (t.dataset.del){
    if (confirm('¿Borrar esta pajereada?')) mutate({ action:'delete', id: t.dataset.del }, 'Borrada');
  }
});

$('cancel').onclick = () => $('dlg').close();
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const por = $('por').value.trim();
  store.set('pajapp.por', por);
  $('dlg').close();
  const n = target;
  mutate({ action:'add', nombre: n, frase: $('frase').value.trim(), por }, `+1 para ${n} 🤚`).then(() => {
    const c = $('c-' + n); if (c){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  });
});

if (!SCRIPT_URL) $('warn').innerHTML = '<div class="warn">Modo demo: los datos se guardan solo en este navegador hasta que se configure la URL del Google Sheet.</div>';
render();
load();
setInterval(load, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
